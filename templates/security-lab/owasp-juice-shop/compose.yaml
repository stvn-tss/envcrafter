# Source stack: networks, names and routing are added by EnvCrafter's renderer.
# Vulnerable lab: no egress network, ever.
services:
  juice-shop:
    image: bkimminich/juice-shop:v20.2.0
    healthcheck:
      # Distroless image (no shell, no curl): probe with the bundled Node.
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1m
