id: audiobookshelf
name: Audiobookshelf
category: media
summary: Self-hosted audiobook and podcast server with web upload and progress sync.
description: >-
  Audiobookshelf streams audiobooks and podcasts to browsers and mobile apps,
  remembers listening progress per user, and fetches metadata and cover art.
  Upload books directly from the web UI; podcasts are downloaded from their
  RSS feeds, which is why this stack has outbound Internet access.
components:
  - service: audiobookshelf
    name: Audiobookshelf 2.36
    role: Audiobook and podcast server (Node.js) with web player and upload.
expose:
  - service: audiobookshelf
    port: 80
secrets: []
needs_internet: true
access_notes:
  - The first visit asks you to create the root (admin) account.
  - Create libraries pointing to /audiobooks and /podcasts, then upload from the web UI.
tags: [media, multimedia, audiobook, podcast, audio, books, livres, streaming]
footprint:
  download_mb: 115
  memory_mb: 150
  first_start_seconds: 20
